name: CI

on:
  push:
    # Die Bot-Straenge leben wochenlang auf feat/*-Zweigen, jeder in einem
    # eigenen Worktree. Mit `branches: [main]` allein sah die CI davon nichts,
    # bis ein PR aufging: feat/earnings-bot sammelte so 34 ungepruefte Commits
    # an, und die zwei Fehler, die der Merge dann zutage foerderte, standen
    # fuenf Wochen unentdeckt im Zweig.
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff==0.15.22

      # Der Umfang steht in pyproject.toml, nicht hier: sonst gibt es zwei
      # Orte, an denen "wird nicht gelintet" entschieden wird, und der
      # zweite ist unsichtbar.
      - name: Ruff lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

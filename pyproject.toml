# Ruff-Linter-Konfiguration.
#
# Scope: das ganze Repository minus der Ausnahmen unten. Die CI ruft
# `ruff check .` auf, damit die Entscheidung, was nicht gelintet wird, an
# genau einer Stelle steht. Vorher stand sie in der Argumentliste der CI
# (`operations/pipeline tests`), und alles ausserhalb dieser zwei Pfade war
# ungeprueft, ohne dass es irgendwo als Entscheidung dokumentiert war —
# `ingest/` und `init_db.py` trugen so drei unbenutzte Importe.
#
# Die Thesis-Analyse (operations/analysis) folgt eigenem Stil und ist
# bewusst vom Gate ausgenommen; dort wird nicht mit-gelintet.
#
# Regelauswahl bleibt bei den Ruff-Defaults (pyflakes F + die kuratierten
# pycodestyle-Fehler E4/E7/E9). E501 (Zeilenlaenge) ist bewusst NICHT
# aktiv; Blind-except (BLE001) wird im Code mit # noqa markiert und nicht
# als Regel erzwungen.

[tool.ruff]
# Muss der Python-Version der CI folgen (.github/workflows/ci.yml).
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# Einmalige Abbildungs-Generatoren im kompakten Matplotlib-Stil (Semikolons,
# einzeilige ifs). Die PNGs stecken in der abgegebenen Arbeit; die Skripte
# nachtraeglich zu reformatieren aendert Belege ohne Gewinn. Echte Fehler
# (F-Regeln) gelten dort weiterhin.
"thesis/figures/make_*.py" = ["E701", "E702"]
line-length = 88
exclude = [
    "operations/analysis",
    "data",
    ".venv",
    "_disabled",
]
